<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <radialGradient id="glow" cx="30%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0080ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0a0e17" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0080ff" stroke-width="0.3" opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="800" height="400" fill="#0a0e17"/>
  <rect width="800" height="400" fill="url(#grid)"/>
  <rect width="800" height="400" fill="url(#glow)"/>
  <!-- Decorative circles -->
  <circle cx="650" cy="80" r="120" fill="none" stroke="#0080ff" stroke-width="0.8" opacity="0.25"/>
  <circle cx="650" cy="80" r="80" fill="none" stroke="#0080ff" stroke-width="0.5" opacity="0.2"/>
  <circle cx="150" cy="320" r="90" fill="none" stroke="#0080ff" stroke-width="0.6" opacity="0.15"/>
  <!-- Accent line -->
  <line x1="60" y1="200" x2="120" y2="200" stroke="#0080ff" stroke-width="2"/>
  <!-- Title -->
  <text x="60" y="180" font-family="Georgia, serif" font-size="48" font-weight="bold" fill="white" opacity="0.95">TCP / IP</text>
  <!-- Subtitle -->
  <text x="62" y="228" font-family="monospace" font-size="14" fill="#0080ff" opacity="0.85" letter-spacing="2">Transmission Control Protocol · Internet Protocol</text>
  <!-- Corner tag -->
  <rect x="0" y="0" width="4" height="400" fill="#0080ff" opacity="0.8"/>
  <!-- Dot pattern -->
  <circle cx="700" cy="350" r="3" fill="#0080ff" opacity="0.4"/>
  <circle cx="720" cy="350" r="3" fill="#0080ff" opacity="0.4"/>
  <circle cx="740" cy="350" r="3" fill="#0080ff" opacity="0.4"/>
  <circle cx="700" cy="370" r="3" fill="#0080ff" opacity="0.3"/>
  <circle cx="720" cy="370" r="3" fill="#0080ff" opacity="0.3"/>
</svg>